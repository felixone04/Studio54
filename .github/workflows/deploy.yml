# Pubblica l'anteprima su GitHub Pages a ogni push su master:
# - il sito (cartella sito/) trasformato da PHP in pagine HTML statiche;
# - l'app Android, presa dall'ultima release del progetto (app/studio54.apk).
name: Pubblica sito

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controllo della sintassi PHP
        run: find sito -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Pagine HTML dal PHP
        run: bash sito/tools/esporta.sh _site

      - name: App Android da scaricare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/app
          gh release download --repo "${{ github.repository }}" --pattern studio54.apk --dir _site/app \
            || echo "Nessuna release con l'APK: il link per scaricarla resterà vuoto."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
