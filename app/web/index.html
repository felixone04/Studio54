<!DOCTYPE html>
<html lang="it">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Studio 54 · Fotografia di matrimoni ed eventi. Guarda i nostri lavori e richiedi un preventivo gratuito.">
  <meta name="theme-color" content="#FFFAF0">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Studio 54">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Studio 54 · Fotografia di matrimoni ed eventi</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFFAF0; }
    /* Logo d'apertura: il logo nero sul fondo crema del sito, per almeno
       2 secondi, poi sfuma. */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #FFFAF0; padding: 0 32px;
      transition: opacity .8s ease, visibility .8s ease;
    }
    #splash.hide { opacity: 0; visibility: hidden; }
    #splash img {
      width: min(380px, 70vw); height: auto;
      opacity: 0; transform: scale(.96);
      animation: show 1.1s cubic-bezier(.2,.7,.2,1) .1s forwards;
    }
    #splash .bar { width: min(160px, 40vw); height: 1px; margin-top: 40px; background: rgba(30,27,23,.15); overflow: hidden; }
    #splash .bar b { display: block; height: 100%; background: #1E1B17; transform-origin: left; transform: scaleX(0); animation: fill 2s ease-in-out forwards; }
    @keyframes show { to { opacity: 1; transform: none; } }
    @keyframes fill { to { transform: scaleX(1); } }
  </style>

  <!-- Google Identity Services: serve per collegare Google Calendar dall'area admin -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="splash" aria-label="Studio 54, caricamento">
    <img src="assets/assets/brand/logo.png" alt="Studio 54">
    <div class="bar"><b></b></div>
  </div>
  <script>
    (function () {
      var start = Date.now();
      var MIN_MS = 2000; // durata minima del logo d'apertura
      window.addEventListener('flutter-first-frame', function () {
        var wait = Math.max(0, MIN_MS - (Date.now() - start));
        setTimeout(function () {
          var s = document.getElementById('splash');
          if (!s) return;
          s.classList.add('hide');
          setTimeout(function () { s.remove(); }, 900);
        }, wait);
      });
    })();
  </script>
  <script>
    // L'avvio si scarica sempre nuovo (è piccolo): GitHub Pages lo farebbe
    // tenere in memoria per 10 minuti, mostrando la versione precedente.
    (function () {
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?t=' + Date.now();
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
