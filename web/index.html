<!DOCTYPE html>
<html lang="it">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Studio Lumen · Wedding & Events. Fotografia di matrimoni ed eventi. Richiedi un preventivo personalizzato.">
  <meta name="theme-color" content="#0B0B0B">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Studio Lumen">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Studio Lumen · Wedding & Events</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0B0B0B; }
    /* Logo d'apertura: copre il sito per almeno 2 secondi, poi sfuma. */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0B0B0B; padding: 0 32px;
      transition: opacity .8s ease, visibility .8s ease;
    }
    #splash.hide { opacity: 0; visibility: hidden; }
    #splash img {
      width: min(420px, 66vw); height: auto;
      opacity: 0; transform: scale(.96);
      animation: show 1.1s cubic-bezier(.2,.7,.2,1) .1s forwards;
    }
    /* Mirino attorno al logo, come la messa a fuoco di una fotocamera. */
    #splash .frame { position: relative; padding: clamp(18px, 5vw, 34px) clamp(20px, 6vw, 40px); }
    #splash .frame i {
      position: absolute; width: 18px; height: 18px; border: 0 solid rgba(255,255,255,.55);
      opacity: 0; animation: focus .9s ease .5s forwards;
    }
    #splash .frame i:nth-child(1) { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
    #splash .frame i:nth-child(2) { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
    #splash .frame i:nth-child(3) { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
    #splash .frame i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }
    #splash .bar { width: min(160px, 40vw); height: 1px; margin-top: 30px; background: rgba(255,255,255,.15); overflow: hidden; }
    #splash .bar b { display: block; height: 100%; background: #fff; transform-origin: left; transform: scaleX(0); animation: fill 2s ease-in-out forwards; }
    @keyframes show { to { opacity: 1; transform: none; } }
    @keyframes focus { from { opacity: 0; transform: scale(1.6); } to { opacity: 1; transform: none; } }
    @keyframes fill { to { transform: scaleX(1); } }
  </style>

  <!-- Google Identity Services: serve per collegare Google Calendar dall'area admin -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="splash" aria-label="Studio Lumen, caricamento">
    <div class="frame">
      <i></i><i></i><i></i><i></i>
      <img src="assets/assets/brand/logo_white.png" alt="Studio Lumen · Wedding & Events">
    </div>
    <div class="bar"><b></b></div>
  </div>
  <script>
    (function () {
      var start = Date.now();
      var MIN_MS = 2000; // durata minima del logo d'apertura
      window.addEventListener('flutter-first-frame', function () {
        var wait = Math.max(0, MIN_MS - (Date.now() - start));
        setTimeout(function () {
          var s = document.getElementById('splash');
          if (!s) return;
          s.classList.add('hide');
          setTimeout(function () { s.remove(); }, 900);
        }, wait);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
