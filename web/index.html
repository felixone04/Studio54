<!DOCTYPE html>
<html lang="it">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Studio 54 · Fotografia di matrimoni ed eventi. Guarda i nostri lavori e richiedi un preventivo gratuito.">
  <meta name="theme-color" content="#FFFAF0">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Studio 54">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Studio 54 · Fotografia di matrimoni ed eventi</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFFAF0; }
    /* Logo d'apertura (il logo principale, su nero): copre il sito per
       almeno 2 secondi, poi sfuma lasciando il posto ai toni chiari. */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #161616; padding: 0 24px;
      transition: opacity .8s ease, visibility .8s ease;
    }
    #splash.hide { opacity: 0; visibility: hidden; }
    /* I bordi della foto del logo sfumano nel nero di fondo, senza toccare
       la scritta (che arriva quasi ai lati): ai lati sfuma il contenitore,
       sopra e sotto l'immagine. */
    #splash .logo {
      width: min(620px, 92vw);
      -webkit-mask-image: linear-gradient(to right, transparent, #000 4%, #000 96%, transparent);
      mask-image: linear-gradient(to right, transparent, #000 4%, #000 96%, transparent);
      opacity: 0; transform: scale(.96);
      animation: show 1.1s cubic-bezier(.2,.7,.2,1) .1s forwards;
    }
    #splash img {
      display: block; width: 100%; height: auto;
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 12%, #000 94%, transparent);
      mask-image: linear-gradient(to bottom, transparent, #000 12%, #000 94%, transparent);
    }
    #splash .bar { width: min(160px, 40vw); height: 1px; margin-top: 8px; background: rgba(255,250,240,.15); overflow: hidden; }
    #splash .bar b { display: block; height: 100%; background: #FFFAF0; transform-origin: left; transform: scaleX(0); animation: fill 2s ease-in-out forwards; }
    @keyframes show { to { opacity: 1; transform: none; } }
    @keyframes fill { to { transform: scaleX(1); } }
  </style>

  <!-- Google Identity Services: serve per collegare Google Calendar dall'area admin -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="splash" aria-label="Studio 54, caricamento">
    <div class="logo"><img src="splash.jpg" alt="Studio 54"></div>
    <div class="bar"><b></b></div>
  </div>
  <script>
    (function () {
      var start = Date.now();
      var MIN_MS = 2000; // durata minima del logo d'apertura
      window.addEventListener('flutter-first-frame', function () {
        var wait = Math.max(0, MIN_MS - (Date.now() - start));
        setTimeout(function () {
          var s = document.getElementById('splash');
          if (!s) return;
          s.classList.add('hide');
          setTimeout(function () { s.remove(); }, 900);
        }, wait);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
